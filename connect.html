
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Megavallia Connect</title>

<style>
:root {
  --bg: #050505;
  --panel: #171719;
  --muted: #aaaab2;
  --pink: #ed48b8;
  --purple: #8d62ff;
  --border: rgba(255,255,255,.1);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
}

button { font: inherit; cursor: pointer; }

.app {
  width: 100%;
  max-width: 650px;
  min-height: 100dvh;
  margin: auto;
  display: flex;
  flex-direction: column;
  position: relative;
  background: #050505;
  overflow: hidden;
}

/* Header */

.topbar {
  height: 66px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  background: #050505;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 18px;
  font-size: 22px;
  font-weight: 700;
}

.topbar button {
  color: white;
  border: 0;
  background: transparent;
  font-size: 25px;
}

.topbar-right {
  display: flex;
  gap: 22px;
  align-items: center;
}

.topbar-right button:last-child {
  color: var(--pink);
}

/* Main content */

main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 0 8px;
}

.view {
  display: none;
  flex: 1;
  min-height: 0;
  flex-direction: column;
}

.view.active { display: flex; }

.card {
  position: relative;
  flex: 1;
  min-height: 440px;
  overflow: hidden;
  border-radius: 0 0 42px 42px;
  background: #171719;
}

.card-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: linear-gradient(145deg,#30203d,#101014);
}

.photo-fallback {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 90px;
  color: white;
  background: linear-gradient(145deg,#53336e,#15151c);
}

.card-shade {
  position: absolute;
  inset: 45% 0 0;
  background: linear-gradient(
    transparent,
    rgba(0,0,0,.25) 35%,
    rgba(0,0,0,.92)
  );
  pointer-events: none;
}

.card-content {
  position: absolute;
  left: 20px;
  right: 20px;
  bottom: 20px;
  z-index: 2;
}

.person-name {
  font-size: clamp(27px, 6vw, 38px);
  font-weight: 800;
  margin: 0 0 22px;
  text-shadow: 0 2px 8px #000;
}

.person-location {
  font-size: 17px;
  display: flex;
  align-items: center;
  gap: 10px;
  text-shadow: 0 2px 6px #000;
}

.person-bio {
  margin-top: 12px;
  color: #eee;
  font-size: 14px;
  line-height: 1.5;
  max-width: 95%;
}

.photo-count {
  position: absolute;
  top: 12px;
  left: 14px;
  right: 14px;
  display: flex;
  gap: 5px;
  z-index: 3;
}

.photo-count span {
  height: 4px;
  border-radius: 5px;
  background: rgba(255,255,255,.4);
  flex: 1;
}

.photo-count span.current { background: white; }

.next-photo {
  position: absolute;
  right: 16px;
  bottom: 150px;
  z-index: 4;
  border: 0;
  border-radius: 50%;
  width: 48px;
  height: 48px;
  background: rgba(0,0,0,.65);
  color: white;
  font-size: 23px;
}

/* Action buttons */

.actions {
  height: 112px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(10px, 3.5vw, 24px);
  padding: 10px 8px 14px;
  background: #050505;
}

.action {
  width: clamp(54px, 13vw, 76px);
  height: clamp(54px, 13vw, 76px);
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.07);
  background: #242427;
  color: white;
  display: grid;
  place-items: center;
  font-size: clamp(25px, 6vw, 36px);
  box-shadow: 0 3px 10px rgba(0,0,0,.3);
  transition: transform .15s, background .15s;
}

.action:active { transform: scale(.9); }

.action.pass {
  width: clamp(68px, 16vw, 92px);
  height: clamp(68px, 16vw, 92px);
  font-size: 48px;
  font-weight: 300;
}

.action.rewind { font-size: 32px; }
.action.star { color: #91b5ff; }
.action.like {
  width: clamp(68px, 16vw, 92px);
  height: clamp(68px, 16vw, 92px);
  color: #f01624;
  font-size: 42px;
}
.action.send { color: #91b5ff; font-size: 31px; }

/* Bottom navigation */

.bottom-nav {
  height: 78px;
  flex-shrink: 0;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 4px 3px max(5px, env(safe-area-inset-bottom));
  background: #050505;
  border-top: 1px solid rgba(255,255,255,.04);
}

.nav-item {
  flex: 1;
  border: 0;
  background: transparent;
  color: #aaaab0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-size: 13px;
  min-width: 0;
}

.nav-icon {
  font-size: 29px;
  line-height: 1;
}

.nav-item.active {
  color: white;
  font-weight: 700;
}

.nav-item.active .nav-icon { color: white; }

.nav-item .pink { color: var(--pink); }

/* Other views */

.page-heading {
  padding: 22px 16px;
  font-size: 25px;
  font-weight: 800;
}

.profile-list {
  overflow-y: auto;
  padding: 0 12px 20px;
}

.profile-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 16px;
}

.profile-row img,
.profile-avatar {
  width: 68px;
  height: 68px;
  object-fit: cover;
  border-radius: 13px;
  background: #30203d;
  flex-shrink: 0;
}

.profile-row h3 { margin: 0 0 5px; font-size: 17px; }
.profile-row p { margin: 0; color: var(--muted); font-size: 13px; }

.profile-form {
  margin: 14px;
  padding: 20px;
  border-radius: 20px;
  background: var(--panel);
  overflow-y: auto;
}

.profile-form h2 { margin-top: 0; }

.profile-form label {
  display: block;
  margin: 15px 0 7px;
  color: #ddd;
  font-size: 14px;
}

.profile-form input,
.profile-form textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #393940;
  border-radius: 10px;
  background: #0d0d10;
  color: white;
  outline: none;
}

.profile-form textarea { min-height: 85px; resize: vertical; }

.profile-form input:focus,
.profile-form textarea:focus { border-color: var(--pink); }

.primary-button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 15px;
  margin-top: 18px;
  color: white;
  font-weight: 700;
  background: linear-gradient(110deg,#8d48ef,#ed48b8);
}

.secondary-button {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  background: #25252a;
  color: white;
}

.status {
  margin: 12px 15px;
  padding: 12px;
  border-radius: 10px;
  background: #211b2b;
  color: #eee;
  font-size: 13px;
  display: none;
}

.status.show { display: block; }

.empty {
  text-align: center;
  color: var(--muted);
  padding: 45px 20px;
  line-height: 1.6;
}

.hidden { display: none !important; }

@media (min-width: 700px) {
  body {
    background: #151419;
    padding: 18px 0;
  }
  .app {
    min-height: calc(100dvh - 36px);
    border: 1px solid #28252c;
    border-radius: 24px;
  }
  .card { border-radius: 20px 20px 35px 35px; }
}
</style>
</head>

<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-left">
      <button id="filterButton" aria-label="Filters">☷</button>
      <span id="headerTitle">For You</span>
    </div>
    <div class="topbar-right">
      <button id="headerExplore" aria-label="Explore">◎</button>
      <button id="headerFeature" aria-label="Featured">ϟ</button>
    </div>
  </header>

  <div id="status" class="status"></div>

  <main>
    <!-- SWIPE VIEW -->
    <section id="swipeView" class="view active">
      <div class="card" id="discoverCard">
        <div class="photo-fallback" id="photoFallback">M</div>
        <img class="card-photo hidden" id="personPhoto" alt="Profile photo">

        <div class="photo-count" id="photoCount"></div>
        <div class="card-shade"></div>

        <button class="next-photo" id="nextPhoto" aria-label="Next photo">↑</button>

        <div class="card-content">
          <h1 class="person-name" id="personName">Discover people</h1>
          <div class="person-location">
            <span>◎</span>
            <span id="personCountry">Meet people on Megavallia</span>
          </div>
          <p class="person-bio" id="personBio"></p>
        </div>
      </div>

      <div class="actions">
        <button class="action rewind" id="rewindButton" aria-label="Rewind">↶</button>
        <button class="action pass" id="passButton" aria-label="Pass">×</button>
        <button class="action star" id="starButton" aria-label="Star">★</button>
        <button class="action like" id="likeButton" aria-label="Like">♥</button>
        <button class="action send" id="sendButton" aria-label="Send">➤</button>
      </div>
    </section>

    <!-- EXPLORE VIEW -->
    <section id="exploreView" class="view">
      <div class="page-heading">Explore</div>
      <div class="profile-list" id="exploreList"></div>
    </section>

    <!-- LIKES / MATCHES VIEW -->
    <section id="likesView" class="view">
      <div class="page-heading">Connections</div>
      <div class="profile-list" id="matchesList"></div>
    </section>

    <!-- CHAT VIEW -->
    <section id="chatView" class="view">
      <div class="page-heading">Chat</div>
      <div class="empty">
        Your conversations will appear here when messaging is available.
      </div>
    </section>

    <!-- PROFILE VIEW -->
    <section id="profileView" class="view">
      <div class="page-heading">My Profile</div>
      <div id="profileFormContainer"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-view="swipe">
      <span class="nav-icon">♨</span>
      <span>Swipe</span>
    </button>
    <button class="nav-item" data-view="explore">
      <span class="nav-icon">◎</span>
      <span>Explore</span>
    </button>
    <button class="nav-item" data-view="likes">
      <span class="nav-icon">♡</span>
      <span>Likes</span>
    </button>
    <button class="nav-item" data-view="chat">
      <span class="nav-icon">▢</span>
      <span>Chat</span>
    </button>
    <button class="nav-item" data-view="profile">
      <span class="nav-icon">♙</span>
      <span>Profile</span>
    </button>
  </nav>
</div>

<!-- Load Supabase first, then the main Megavallia authentication script -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/app.js"></script>

<script>
(() => {
  "use strict";

  const API = "https://megavallia.onrender.com/api/connect";

  const $ = id => document.getElementById(id);

  let myProfile = null;
  let discoverProfiles = [];
  let currentIndex = 0;
  let currentPhotoIndex = 0;
  let currentProfile = null;

  function showStatus(message) {
    const el = $("status");
    el.textContent = message;
    el.classList.add("show");
  }

  function hideStatus() {
    $("status").classList.remove("show");
  }

  async function getToken() {
    if (typeof window.getMegavalliaAccessToken !== "function") {
      throw new Error(
        "Megavallia login could not be loaded. Please return to the main website and sign in."
      );
    }

    return await window.getMegavalliaAccessToken();
  }

  async function api(path, options = {}) {
    const token = await getToken();
    const headers = new Headers(options.headers || {});

    headers.set("Authorization", "Bearer " + token);
    headers.set("Accept", "application/json");

    if (options.body && !(options.body instanceof FormData)) {
      headers.set("Content-Type", "application/json");
    }

    const response = await fetch(API + path, {
      ...options,
      headers
    });

    let data = {};
    try {
      data = await response.json();
    } catch (_) {}

    if (!response.ok) {
      throw new Error(
        data.error || data.message || ("Request failed (" + response.status + ")")
      );
    }

    return data;
  }

  function setView(name) {
    document.querySelectorAll(".view").forEach(view => {
      view.classList.remove("active");
    });

    const target = $(name + "View");
    if (target) target.classList.add("active");

    document.querySelectorAll(".nav-item").forEach(button => {
      button.classList.toggle("active", button.dataset.view === name);
    });

    const titles = {
      swipe: "For You",
      explore: "Explore",
      likes: "Likes",
      chat: "Chat",
      profile: "Profile"
    };

    $("headerTitle").textContent = titles[name] || "Connect";

    if (name === "explore") loadExplore();
    if (name === "likes") loadMatches();
    if (name === "profile") renderProfileForm();
  }

  document.querySelectorAll(".nav-item").forEach(button => {
    button.addEventListener("click", () => setView(button.dataset.view));
  });

  $("headerExplore").addEventListener("click", () => setView("explore"));

  $("filterButton").addEventListener("click", () => {
    showStatus("Discovery filters will be available in a future update.");
  });

  $("headerFeature").addEventListener("click", () => {
    showStatus("Featured profiles are coming soon.");
  });

  function profileName(profile) {
    const account = profile.account || {};
    return account.display_name || account.username || "Megavallia member";
  }

  function profilePhoto(profile) {
    return profile.primary_photo ||
      (Array.isArray(profile.photos) ? profile.photos[0] : null) ||
      (profile.account && profile.account.avatar_url) ||
      null;
  }

  function renderPhoto(profile) {
    const photo = $("personPhoto");
    const fallback = $("photoFallback");
    const photos = [
      profile.primary_photo,
      ...(profile.photos || [])
    ].filter(Boolean);

    const uniquePhotos = [...new Set(photos)];
    currentPhotoIndex = Math.min(currentPhotoIndex, Math.max(0, uniquePhotos.length - 1));

    const selected = uniquePhotos[currentPhotoIndex] || profilePhoto(profile);

    if (selected) {
      photo.src = selected;
      photo.classList.remove("hidden");
      fallback.classList.add("hidden");

      photo.onerror = () => {
        photo.classList.add("hidden");
        fallback.classList.remove("hidden");
      };
    } else {
      photo.classList.add("hidden");
      fallback.classList.remove("hidden");
      fallback.textContent = profileName(profile).charAt(0).toUpperCase();
    }

    const count = $("photoCount");
    count.replaceChildren();

    uniquePhotos.forEach((_, index) => {
      const bar = document.createElement("span");
      if (index === currentPhotoIndex) bar.classList.add("current");
      count.appendChild(bar);
    });

    $("nextPhoto").classList.toggle("hidden", uniquePhotos.length < 2);
  }

  function displayProfile(profile) {
    currentProfile = profile;
    currentPhotoIndex = 0;

    $("personName").textContent =
      profileName(profile) +
      (profile.age ? " " + profile.age : "");

    $("personCountry").textContent = profile.country || "Location not specified";
    $("personBio").textContent = profile.bio || "";

    renderPhoto(profile);
  }

  function showEmptyDiscovery(message) {
    currentProfile = null;
    $("personName").textContent = message;
    $("personCountry").textContent = "";
    $("personBio").textContent = "Check back later for more people to discover.";
    $("personPhoto").classList.add("hidden");
    $("photoFallback").classList.remove("hidden");
    $("photoFallback").textContent = "M";
    $("photoCount").replaceChildren();
    $("nextPhoto").classList.add("hidden");
  }

  async function loadDiscover() {
    hideStatus();

    try {
      const result = await api("/discover");
      discoverProfiles = Array.isArray(result.profiles) ? result.profiles : [];
      currentIndex = 0;

      if (!discoverProfiles.length) {
        showEmptyDiscovery("No profiles available");
        return;
      }

      displayProfile(discoverProfiles[currentIndex]);
    } catch (error) {
      showEmptyDiscovery("Unable to load profiles");
      showStatus(error.message);
    }
  }

  $("nextPhoto").addEventListener("click", () => {
    if (!currentProfile) return;

    const photos = [
      currentProfile.primary_photo,
      ...(currentProfile.photos || [])
    ].filter(Boolean);

    const uniquePhotos = [...new Set(photos)];
    if (uniquePhotos.length < 2) return;

    currentPhotoIndex = (currentPhotoIndex + 1) % uniquePhotos.length;
    renderPhoto(currentProfile);
  });

  async function swipe(action) {
    if (!currentProfile) {
      showStatus("There is no profile to select right now.");
      return;
    }

    const selected = currentProfile;
    hideStatus();

    try {
      await api("/swipe/" + encodeURIComponent(selected.user_id), {
        method: "POST",
        body: JSON.stringify({ action })
      });

      currentIndex++;

      if (currentIndex < discoverProfiles.length) {
        displayProfile(discoverProfiles[currentIndex]);
      } else {
        showEmptyDiscovery("You're all caught up");
        loadDiscover();
      }
    } catch (error) {
      showStatus(error.message);
    }
  }

  $("passButton").addEventListener("click", () => swipe("pass"));
  $("likeButton").addEventListener("click", () => swipe("like"));

  $("rewindButton").addEventListener("click", () => {
    showStatus("Rewind is not connected to the current Connect API yet.");
  });

  $("starButton").addEventListener("click", () => {
    showStatus("Star is reserved for a future featured interaction.");
  });

  $("sendButton").addEventListener("click", () => {
    showStatus("Sending profiles is not available yet.");
  });

  function makeProfileRow(profile) {
    const row = document.createElement("div");
    row.className = "profile-row";

    const img = document.createElement("img");
    img.alt = "Profile photo";

    const source = profilePhoto(profile);
    if (source) img.src = source;

    const details = document.createElement("div");

    const heading = document.createElement("h3");
    heading.textContent = profileName(profile) +
      (profile.age ? " · " + profile.age : "");

    const description = document.createElement("p");
    description.textContent =
      [profile.country, profile.bio].filter(Boolean).join(" · ") ||
      "Megavallia member";

    details.append(heading, description);
    row.append(img, details);

    return row;
  }

  async function loadExplore() {
    const list = $("exploreList");
    list.replaceChildren();

    try {
      const result = await api("/discover");
      const profiles = Array.isArray(result.profiles) ? result.profiles : [];

      if (!profiles.length) {
        list.textContent = "No profiles available yet.";
        return;
      }

      profiles.forEach(profile => list.appendChild(makeProfileRow(profile)));
    } catch (error) {
      showStatus(error.message);
    }
  }

  async function loadMatches() {
    const list = $("matchesList");
    list.replaceChildren();

    try {
      const result = await api("/matches");
      const matches = Array.isArray(result.matches) ? result.matches : [];

      if (!matches.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Your connections will appear here when you make a mutual connection.";
        list.appendChild(empty);
        return;
      }

      matches.forEach(profile => {
        const row = makeProfileRow(profile);

        const socialLinks = profile.show_social_links
          ? profile.social_links || {}
          : {};

        Object.entries(socialLinks).forEach(([platform, url]) => {
          if (!url) return;

          try {
            const parsed = new URL(url);
            if (!["http:", "https:"].includes(parsed.protocol)) return;

            const link = document.createElement("a");
            link.href = parsed.href;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = platform;
            link.style.color = "#ed72c6";
            link.style.marginLeft = "8px";
            row.appendChild(link);
          } catch (_) {}
        });

        list.appendChild(row);
      });
    } catch (error) {
      showStatus(error.message);
    }
  }

  function renderProfileForm() {
    const container = $("profileFormContainer");
    container.replaceChildren();

    const form = document.createElement("form");
    form.className = "profile-form";

    form.innerHTML = `
      <h2>Create your Connect profile</h2>
      <p style="color:#aaa;font-size:13px">
        Add your details and up to three photos so people can discover you.
      </p>

      <label for="connectAge">Age (18+)</label>
      <input id="connectAge" type="number" min="18" max="120" required>

      <label for="connectCountry">Country</label>
      <input id="connectCountry" type="text" maxlength="80" required>

      <label for="connectBio">About you</label>
      <textarea id="connectBio" maxlength="300"
        placeholder="Write a short introduction"></textarea>

      <label for="connectPrimaryPhoto">Main photo (required)</label>
      <input id="connectPrimaryPhoto" type="file"
        accept="image/jpeg,image/png,image/webp">

      <label for="connectGalleryPhotos">Two additional photos (optional)</label>
      <input id="connectGalleryPhotos" type="file"
        accept="image/jpeg,image/png,image/webp" multiple>

      <label for="connectWhatsapp">WhatsApp link</label>
      <input id="connectWhatsapp" type="url" placeholder="https://wa.me/...">

      <label for="connectInstagram">Instagram link</label>
      <input id="connectInstagram" type="url" placeholder="https://instagram.com/...">

      <label for="connectTelegram">Telegram link</label>
      <input id="connectTelegram" type="url" placeholder="https://t.me/...">

      <label for="connectOther">Other social link</label>
      <input id="connectOther" type="url" placeholder="https://...">

      <label style="display:flex;align-items:center;gap:10px">
        <input id="connectShowLinks" type="checkbox" style="width:auto">
        Show my social links to my connections
      </label>

      <button class="primary-button" type="submit">Save Connect Profile</button>
    `;

    if (myProfile) {
      $("connectAge", form).value = myProfile.age || "";
      $("connectCountry", form).value = myProfile.country || "";
      $("connectBio", form).value = myProfile.bio || "";

      const links = myProfile.social_links || {};
      $("connectWhatsapp", form).value = links.whatsapp || "";
      $("connectInstagram", form).value = links.instagram || "";
      $("connectTelegram", form).value = links.telegram || "";
      $("connectOther", form).value = links.other || "";
      $("connectShowLinks", form).checked = !!myProfile.show_social_links;

      form.querySelector("h2").textContent = "Edit your Connect profile";
    }

    form.addEventListener("submit", saveProfile);
    container.appendChild(form);
  }

  function validOptionalUrl(value) {
    if (!value.trim()) return "";

    const parsed = new URL(value);
    if (!["http:", "https:"].includes(parsed.protocol)) {
      throw new Error("Please use a valid HTTPS or HTTP link.");
    }

    return parsed.href;
  }

  async function saveProfile(event) {
    event.preventDefault();
    hideStatus();

    const form = event.currentTarget;
    const submit = form.querySelector("button[type=submit]");
    submit.disabled = true;
    submit.textContent = "Saving...";

    try {
      const age = Number($("connectAge").value);
      const country = $("connectCountry").value.trim();

      if (!Number.isInteger(age) || age < 18 || age > 120) {
        throw new Error("You must be at least 18 years old.");
      }

      const body = {
        age,
        country,
        bio: $("connectBio").value.trim(),
        social_links: {
          whatsapp: validOptionalUrl($("connectWhatsapp").value),
          instagram: validOptionalUrl($("connectInstagram").value),
          telegram: validOptionalUrl($("connectTelegram").value),
          other: validOptionalUrl($("connectOther").value)
        },
        show_social_links: $("connectShowLinks").checked
      };

      await api("/profile", {
        method: "PUT",
        body: JSON.stringify(body)
      });

      const primary = $("connectPrimaryPhoto").files[0];
      const gallery = Array.from($("connectGalleryPhotos").files);

      if (gallery.length > 2) {
        throw new Error("Please select no more than two additional photos.");
      }

      if (primary) {
        const data = new FormData();
        data.append("primaryPhoto", primary);

        await api("/primary-photo", {
          method: "POST",
          body: data
        });
      }

      if (gallery.length) {
        const data = new FormData();
        gallery.forEach(file => data.append("photos", file));

        await api("/photos", {
          method: "POST",
          body: data
        });
      }

      await loadMe();
      showStatus("Your Connect profile has been saved.");
      setView("swipe");
      await loadDiscover();

    } catch (error) {
      showStatus(error.message);
    } finally {
      submit.disabled = false;
      submit.textContent = "Save Connect Profile";
    }
  }

  async function loadMe() {
    const result = await api("/me");
    myProfile = result.profile || null;

    if (!myProfile) {
      setView("profile");
      showStatus("Create your Connect profile before discovering people.");
      renderProfileForm();
      return;
    }

    return myProfile;
  }

  async function start() {
    try {
      await loadMe();

      if (myProfile) {
        await loadDiscover();
      }
    } catch (error) {
      showStatus(error.message + " Sign in on the main Megavallia website first.");
      showEmptyDiscovery("Sign in to continue");

      const link = document.createElement("a");
      link.href = "/";
      link.textContent = "Go to Megavallia and sign in";
      link.style.color = "#ed72c6";
      link.style.display = "block";
      link.style.textAlign = "center";
      link.style.padding = "15px";

      $("discoverCard").appendChild(link);
    }
  }

  start();
})();
</script>
</body>
</html>
